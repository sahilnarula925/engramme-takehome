# A starting point. Replace `db` with whatever storage you choose.
# The crash scenario SIGKILLs every container without takehome.persistent=true, then runs `docker compose up -d`.
services:
  memkit:
    build: ./starter-kit  # path to this starter kit
    ports:
      - "7070:7070"
    labels:
      takehome.persistent: "true"

  db:
    image: postgres:16
    environment:
      POSTGRES_PASSWORD: takehome
    volumes:
      - db-data:/var/lib/postgresql/data
    labels:
      takehome.persistent: "true"

  app:
    build: .
    ports:
      - "8080:8080"
    environment:
      MEMKIT_URL: http://memkit:7070
      DATABASE_URL: postgres://postgres:takehome@db:5432/postgres
    depends_on:
      - memkit
      - db

volumes:
  db-data:
