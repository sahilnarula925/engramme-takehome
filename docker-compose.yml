services:
  memkit:
    build: ./starter-kit
    ports: ["7070:7070"]
    labels:
      takehome.persistent: "true"
  db:
    image: postgres:16
    environment:
      POSTGRES_PASSWORD: takehome
    volumes: ["db-data:/var/lib/postgresql/data"]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 1s
      timeout: 3s
      retries: 30
    labels:
      takehome.persistent: "true"
  app:
    build: .
    ports: ["8080:8080"]
    environment:
      DATABASE_URL: postgresql://postgres:takehome@db:5432/postgres
      MEMKIT_URL: http://memkit:7070
      OPENBLAS_NUM_THREADS: "1"
    depends_on:
      db:
        condition: service_healthy
      memkit:
        condition: service_started
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8080/v1/health')"]
      interval: 2s
      timeout: 3s
      retries: 30
volumes:
  db-data:
